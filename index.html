<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 게임 화면은 확대/축소를 허용하지 않는다. 보기 버튼을 두 번 탭할 때 확대되면 조작이 깨진다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10151f" />
    <meta name="description" content="계단을 오르며 영어 단어를 익히는 게임" />
    <!-- 파일을 늘리지 않기 위해 인라인 SVG 를 파비콘으로 쓴다 (요청 0개) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🪜</text></svg>"
    />
    <!-- iOS 는 manifest 의 icons 를 쓰지 않는다 — 별도 링크가 필요하다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>영어계단</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
